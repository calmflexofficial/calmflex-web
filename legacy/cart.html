<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Review your CalmFlex shopping cart and checkout." />
    <title>Your Cart | CalmFlex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .cart-page{margin:auto;max-width:1100px;padding:70px 5vw 120px}.cart-page h1,.checkout-panel h2{font-family:var(--serif);font-size:clamp(50px,7vw,80px);font-weight:500;letter-spacing:-.06em;line-height:1;margin:0}.cart-layout{display:grid;gap:70px;grid-template-columns:1.3fr .7fr;margin-top:55px}.cart-list{border-top:1px solid var(--line)}.cart-row{align-items:center;border-bottom:1px solid var(--line);display:grid;gap:20px;grid-template-columns:95px 1fr auto auto;padding:20px 0}.cart-row-image{align-items:center;background:#ecebe5;display:flex;height:95px;justify-content:center;overflow:hidden}.cart-row-image img{height:100%;object-fit:contain;width:100%}.cart-row h2{font-size:14px;margin:0 0 7px}.cart-row p{color:var(--muted);font-size:12px;margin:0}.cart-row strong{font-size:14px;white-space:nowrap}.row-remove{background:none;border:0;color:var(--muted);cursor:pointer;font-size:11px}.cart-quantity{align-items:center;border:1px solid var(--line);display:flex;gap:14px;padding:8px 10px}.cart-quantity button{background:none;border:0;cursor:pointer;font-size:16px}.cart-summary{background:#e4eadf;height:max-content;padding:30px}.cart-summary h2{font-family:var(--serif);font-size:31px;font-weight:500;margin:0 0 30px}.summary-line{display:flex;font-size:13px;justify-content:space-between;margin:15px 0}.summary-total{border-top:1px solid var(--line);font-size:18px;font-weight:600;padding-top:18px}.shipping-note{color:#667861;font-size:11px;line-height:1.5}.checkout-panel{display:none}.checkout-panel.visible{display:block}.checkout-panel h2{font-size:49px}.checkout-form{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:30px}.checkout-form label{font-size:11px}.checkout-form input,.checkout-form select{background:transparent;border:0;border-bottom:1px solid var(--line);margin-top:7px;outline:0;padding:12px 0;width:100%}.checkout-form .full-field{grid-column:1/-1}.payment-box{border-top:1px solid var(--line);margin-top:28px;padding-top:22px}.payment-box p{font-size:11px}.payment-options{display:flex;gap:10px}.payment-options label{border:1px solid var(--line);cursor:pointer;padding:12px}.payment-options input{accent-color:var(--ink);margin-right:6px;width:auto}.empty-state{color:var(--muted);padding:35px 0}.hidden{display:none}@media(max-width:800px){.cart-page{padding:45px 6vw 75px}.cart-layout{display:block;margin-top:40px}.cart-summary{margin-top:35px}.cart-row{gap:12px;grid-template-columns:70px 1fr auto}.cart-row-image{height:80px}.cart-row>strong{grid-column:2}.cart-quantity{grid-column:3;grid-row:1}.row-remove{grid-column:2;text-align:left}.checkout-form{display:block}.checkout-form label{display:block;margin-bottom:14px}.payment-options{flex-wrap:wrap}}
    </style>
  </head>
  <body>
    <div class="announcement">FREE SHIPPING ON ORDERS ABOVE <strong>₹499</strong></div>
    <div class="header-bar"><header class="site-header"><a class="brand" href="index.html" aria-label="CalmFlex home"><img src="assets/calmflex-logo.jpg" alt="CalmFlex" /></a><nav class="desktop-nav"><a href="shop.html">Shop</a><a href="index.html#categories">Categories</a><a href="index.html#story">Our story</a></nav><a class="text-link" href="shop.html">Continue shopping <span>→</span></a></header></div>
    <main class="cart-page"><section id="cart-view"><p class="eyebrow">YOUR CALMFLEX EDIT</p><h1>Your cart.</h1><div class="cart-layout"><div class="cart-list" id="cart-list"></div><aside class="cart-summary"><h2>Order summary</h2><div class="summary-line"><span>Subtotal</span><strong id="subtotal">₹0</strong></div><div class="summary-line"><span>Shipping</span><strong id="shipping">₹0</strong></div><p class="shipping-note" id="shipping-note">Add ₹499 more for free delivery.</p><div class="summary-line summary-total"><span>Total</span><strong id="total">₹0</strong></div><button class="button button-dark" id="checkout-button" style="border:0;margin-top:20px;width:100%">Checkout <span>↗</span></button></aside></div></section><section class="checkout-panel" id="checkout-view"><p class="eyebrow">SECURE CHECKOUT</p><h2>Almost yours.</h2><form class="checkout-form" id="checkout-form"><label>Full name<input required name="name" placeholder="Your name" /></label><label>Mobile number<input required name="phone" inputmode="tel" placeholder="10-digit number" /></label><label class="full-field">Email address<input required type="email" name="email" placeholder="you@example.com" /></label><label class="full-field">Address<input required name="address" placeholder="House number and street" /></label><label>City<input required name="city" placeholder="City" /></label><label>PIN code<input required name="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" /></label><div class="payment-box full-field"><p>Payment method</p><div class="payment-options"><label><input type="radio" name="payment" value="upi" checked /> UPI</label><label><input type="radio" name="payment" value="card" /> Card</label><label><input type="radio" name="payment" value="cod" /> Cash on delivery</label></div><p id="payment-message" class="shipping-note"></p></div><button class="button button-dark full-field" type="submit">Place order <span>↗</span></button></form></section></main>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script><script type="module" src="cart.js"></script>
  </body>
</html>
